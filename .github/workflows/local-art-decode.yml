name: Verify local Unity Sprite decoding (no art uploads)
on:
  push:
    paths:
      - 'tools/export_local_ui_art.py'
      - 'tests/test_local_ui_art.py'
      - 'tools/build_unity_prefab_manifest.py'
      - 'tests/test_unity_prefab_manifest.py'
      - 'tools/export_local_ui_layout.py'
      - 'tests/test_local_ui_layout.py'
      - 'tools/audit_local_ui_components.py'
      - 'tools/trace_local_spine_links.py'
      - 'tools/export_local_spine.py'
      - 'tests/test_xapk_deep_evidence.py'
      - 'tools/audit_original_unity_graph.py'
      - 'tests/test_original_unity_graph.py'
      - '.github/workflows/local-art-decode.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout real XAPK via Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Unity sprite decoding tools
        run: python -m pip install UnityPy Pillow
      - name: Simulate stale previously unpacked APKs
        run: |
          mkdir -p output/apks
          printf "stale apk" > output/apks/old.apk
      - name: Extract local-only Sprite PNGs from canonical XAPK
        run: python tools/export_local_ui_art.py
      - name: Construct exact Unity Canvas import plan
        run: python tools/build_unity_prefab_manifest.py
      - name: Validate 5 scene mapping counts and Spine reference status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('output/unity-prefab-map.json').read_text(encoding='utf-8'))
          assert len(m['scenes']) == 5
          assert m['sprites'] and m['spine']
          assert all(row['bindingStatus'] in ('pointer_candidates_unverified','unresolved') for row in m['spine'])
          assert next(x['mappedSprites'] for x in m['scenes'] if x['sceneId']=='REF01-ship-upgrade') == 32
          print('PASS: Unity reconstructed source map',len(m['sprites']),'sprite assignments',len(m['spine']),'Spine nodes')
          PY
      - name: Verify deep UI/Spine parsing without XAPK
        run: python -m unittest discover -s tests -p test_xapk_deep_evidence.py -v
      - name: Probe Sprite borders, CanvasScaler, Mask, LayoutGroup from XAPK
        run: python tools/audit_local_ui_components.py
      - name: Trace original Spine component to TextAssets (field still unverified)
        run: python tools/trace_local_spine_links.py
      - name: Export local Spine 3.8 source packs chosen by REF04 content evidence
        run: python tools/export_local_spine.py --from-evidence REF04-home-crew --limit 12
      - name: Verify REF04 candidate skeleton names match selected packs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('output/local-spine-link-evidence.json').read_text(encoding='utf-8'))
          packs=json.loads(Path('output/local-spine/manifest.json').read_text(encoding='utf-8'))
          verified={x['skeletonName'] for x in e['records'] if
                    x['sceneId']=='REF04-home-crew' and
                    x['status']=='content_chain_verified_field_unverified'}
          assert packs['packages'] and all(p['name'] in verified for p in packs['packages'])
          print('PASS: REF04 local 3.8 packs selected by original content:',len(packs['packages']))
          PY
      - name: Validate deep evidence counts and zero false binding claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          u = json.loads(Path('output/local-ui-components.json').read_text(encoding='utf-8'))
          s = json.loads(Path('output/local-spine-link-evidence.json').read_text(encoding='utf-8'))
          assert len(u['scenes']) == 5
          assert len(s['records']) == 32
          assert u['stats']['spriteGeometry'] == 826
          assert u['stats']['spriteBorders'] == 826
          assert s['stats'].get('content_chain_verified_field_unverified') == 13
          assert all(not x['fieldVerified'] and not x['skinVerified'] and
                     not x['activeAnimationVerified'] for x in s['records'])
          print('DEEP EVIDENCE PASS:', u['stats'], s['stats'])
          PY
      - name: Test exact Unity serialized GO and prefab-pointer evidence
        run: python -m unittest discover -s tests -p test_original_unity_graph.py -v
      - name: Audit original serialized GameObject/component graph from XAPK
        run: python tools/audit_original_unity_graph.py
      - name: Check original graph coverage without claiming real editor Prefabs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('output/original-unity-graph.json').read_text(encoding='utf-8'))
          assert data['version']==1
          assert len(data['scenes'])==5
          assert data['stats']['nodes']==1670
          assert all(s['provenance']['originalEditorPrefabOrScene']=='NOT_PROVEN'
                     for s in data['scenes'])
          assert all(s['stats']['nodes']==s['stats']['gameObjects'] for s in data['scenes'])
          print('PASS: original serialized graph',data['stats'])
          for scene in data['scenes']:
              print(scene['sceneId'], scene['stats']['nodes'],
                    scene['stats']['componentReferences'],
                    scene['provenance']['sourceTypeCounts'])
          PY
      - name: Extract verified RectTransform and Canvas evidence from real XAPK
        run: python tools/export_local_ui_layout.py
      - name: Check all 5 serialized Unity hierarchies are matched exactly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('output/local-ui-layout.json').read_text(encoding='utf-8'))
          stats = data['stats']
          assert stats['scenes'] == 5
          assert stats['verifiedTransforms'] == 1670, stats
          for scene in data['scenes']:
              assert len({node['nodeId'] for node in scene['nodes']}) == len(scene['nodes'])
          print('PASS: exact XAPK layout evidence', stats)
          PY
      - name: Verify decoded PNGs and mapped scene paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root = Path("output/local-ui-art")
          info = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert info["version"] == 1
          print("Sprite images exported:", info["stats"]["sprite_images_exported"])
          print("UI nodes mapped:", info["stats"]["ui_nodes_mapped"])
          assert info["stats"]["sprite_images_exported"] > 0, "No Sprite could be decoded"
          assert info["stats"]["ui_nodes_mapped"] > 0, "No Image→Sprite mapping produced"
          for name in info["files"]:
              with Image.open(root / name) as image:
                  image.verify()
          print("PASS: local Sprite files verified, no artwork uploaded")
          PY

  windows-decode:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout real XAPK with Git LFS on Windows
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Prepare Windows Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UnityPy and Pillow
        run: python -m pip install UnityPy Pillow
      - name: Test Windows-safe in-memory bundle reader
        run: python -m unittest discover -s tests -p test_local_ui_art.py -v
      - name: Extract actual game Sprite PNGs from XAPK on Windows
        run: python tools/export_local_ui_art.py
      - name: Verify deep evidence unit tests on Windows
        run: python -m unittest discover -s tests -p test_xapk_deep_evidence.py -v
      - name: Probe UI fields and original Sprite borders on Windows
        run: python tools/audit_local_ui_components.py
      - name: Trace Spine to local TextAsset content on Windows
        run: python tools/trace_local_spine_links.py
      - name: Export REF04 matched real Spine source packs on Windows
        run: python tools/export_local_spine.py --from-evidence REF04-home-crew --limit 12
      - name: Test native GameObject component pointers on Windows
        run: python -m unittest discover -s tests -p test_original_unity_graph.py -v
      - name: Check original serialized scene/prefab candidate inventory on Windows
        run: python tools/audit_original_unity_graph.py
      - name: Require complete original 5-scene pointers on Windows
        run: |
          python -c "import json; from pathlib import Path; x=json.loads(Path('output/original-unity-graph.json').read_text(encoding='utf-8')); assert len(x['scenes'])==5 and x['stats']['nodes']==1670; print('ORIGINAL GRAPH WINDOWS PASS:', x['stats'])"
      - name: Extract exact XAPK layout evidence on Windows
        run: python tools/export_local_ui_layout.py
      - name: Verify Windows evidence and no fake CanvasScaler claims
        run: |
          python -c "import json; from pathlib import Path; p=Path('output/local-ui-layout.json'); d=json.loads(p.read_text(encoding='utf-8')); assert d['stats']['verifiedTransforms']==1670; print('WINDOWS LAYOUT PASS:', d['stats'])"
      - name: Prepare Windows Unity Canvas import plan from real XAPK Sprite art
        run: python tools/build_unity_prefab_manifest.py
      - name: Verify generated Sprite manifest, status and scene coverage
        run: |
          python -c "import json; from pathlib import Path; d=Path('output/local-ui-art'); m=json.loads((d/'manifest.json').read_text(encoding='utf-8')); s=json.loads((d/'export-status.json').read_text(encoding='utf-8')); assert s['status']=='PASS'; assert m['stats']['sprite_images_exported'] > 0; assert m['stats']['scene_nodes_mapped']['REF01-ship-upgrade'] > 0; assert all((d/f).is_file() for f in m['files']); print('WINDOWS PASS:',s['sprite_images_exported'],'Sprite PNGs,',s['ui_nodes_mapped'],'nodes')"
