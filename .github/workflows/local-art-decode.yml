name: Verify local Unity Sprite decoding (no art uploads)
on:
  push:
    paths:
      - 'tools/export_local_ui_art.py'
      - 'tests/test_local_ui_art.py'
      - 'tools/build_unity_prefab_manifest.py'
      - 'tests/test_unity_prefab_manifest.py'
      - 'tools/export_local_ui_layout.py'
      - 'tests/test_local_ui_layout.py'
      - 'tools/audit_local_ui_components.py'
      - 'tools/trace_local_spine_links.py'
      - 'tools/export_local_spine.py'
      - 'tests/test_xapk_deep_evidence.py'
      - 'tools/audit_original_unity_graph.py'
      - 'tests/test_original_unity_graph.py'
      - 'tools/summarize_original_unity_gaps.py'
      - 'tools/decode_xapk_ui_provenance.py'
      - 'tools/recover_managed_ui_fields.py'
      - 'tools/probe_xapk_typetree_backends.py'
      - 'tools/compare_managed_ui_backends.py'
      - 'tools/build_verified_ui_prefab_plan.py'
      - 'tools/build_verified_visual_plan.py'
      - 'tools/report_source_visual_layout_gaps.py'
      - 'tools/audit_ref04_static_ui_geometry.py'
      - 'tools/report_ref04_png_rect_mismatch.py'
      - 'tests/test_ref04_png_rect_mismatch.py'
      - 'tools/report_ref04_source_atlas_offsets.py'
      - 'tests/test_ref04_source_atlas_offsets.py'
      - 'tools/compare_ref04_game_screenshots.py'
      - 'tests/test_ref04_game_screenshot_compare.py'
      - 'tools/build_ref04_native_bounds_sprites.py'
      - 'tests/test_ref04_native_bounds_sprites.py'
      - 'unity-ui-viewer/Assets/Editor/Ref04NativeBoundsPreviewImporter.cs'
      - 'tests/test_ref04_native_bounds_unity_contract.py'
      - 'tools/prepare_ref04_native_bounds_preview.py'
      - 'tools/audit_ref04_3c_image_inventory.py'
      - 'tools/audit_ref04_full_source_inventory.py'
      - 'tools/probe_ref04_layout_third_backend.py'
      - 'tools/probe_ref04_layout_schema_forensics.py'
      - 'tools/ref04_layout_raw_parser.py'
      - 'tools/ref04_layout_dual_schema_bytes.py'
      - 'tests/test_ref04_layout_dual_schema_bytes.py'
      - 'tests/test_ref04_layout_raw_parser.py'
      - 'tests/test_ref04_layout_schema_forensics.py'
      - 'tests/test_ref04_layout_third_backend.py'
      - 'tools/audit_ref04_step2_layout_canvas_text.py'
      - 'tools/ref04_il2cpp_method_index_v31.py'
      - 'tools/audit_ref04_p2_runtime_alignment.py'
      - 'tools/ref04_arm64_elf_regions.py'
      - 'tools/ref04_p2_native_method_candidates.py'
      - 'tests/test_ref04_p2_native_method_candidates.py'
      - 'tests/test_ref04_arm64_elf_regions.py'
      - 'tools/audit_ref04_p3_text_localization.py'
      - 'tools/probe_ref04_p3_original_font_objects.py'
      - 'tools/probe_ref04_p3_localizer_binary.py'
      - 'tests/test_ref04_p3_localizer_binary.py'
      - 'tests/test_ref04_p3_original_font_objects.py'
      - 'tests/test_ref04_p3_text_localization.py'
      - 'tests/test_ref04_il2cpp_method_index_v31.py'
      - 'tests/test_ref04_p2_runtime_alignment.py'
      - 'tests/test_ref04_step2_layout_canvas_text.py'
      - 'tools/probe_ref04_text_source_binary.py'
      - 'tests/test_ref04_text_source_binary.py'
      - 'tests/test_ref04_full_source_inventory.py'
      - 'docs/XAPK_SOURCE_ONLY_UI_RULES.md'
      - 'AGENTS.md'
      - 'tests/test_ref04_3c_image_inventory.py'
      - 'tests/test_ref04_static_ui_geometry.py'
      - 'tests/test_ref04_static_geometry_unity_contract.py'
      - 'unity-ui-viewer/Assets/Editor/Ref04SourceSpriteGeometryAudit.cs'
      - 'tests/test_source_root_canvas_viewport_contract.py'
      - 'tests/test_verified_visual_plan.py'
      - 'tests/test_verified_visual_unity_contract.py'
      - 'unity-ui-viewer/Assets/Editor/VerifiedVisualStudyImporter.cs'
      - 'unity-ui-viewer/Assets/Scripts/VerifiedVisualPreviewEvidence.cs'
      - 'tests/test_verified_ui_prefab_plan.py'
      - 'tests/test_verified_ui_unity_contract.py'
      - 'unity-ui-viewer/Assets/Editor/VerifiedManagedUiPrefabImporter.cs'
      - 'unity-ui-viewer/Assets/Scripts/ManagedUiSourceEvidence.cs'
      - 'tests/test_compare_managed_ui_backends.py'
      - 'tests/test_decode_xapk_ui_provenance.py'
      - 'tests/test_recover_managed_ui_fields.py'
      - 'tests/test_original_unity_gaps.py'
      - '.github/workflows/local-art-decode.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decode:
    runs-on: ubuntu-latest
    outputs:
      source_verified_fields: ${{ steps.ref04_independent_field_proof.outputs.verified_fields }}
      source_blocker: ${{ steps.ref04_independent_field_proof.outputs.top_blocker }}
      studio_byte_status: ${{ steps.ref04_independent_field_proof.outputs.top_raw_status }}
      layout_schema_status: ${{ steps.ref04_independent_field_proof.outputs.top_schema_status }}
      ripper_failure: ${{ steps.ref04_independent_field_proof.outputs.ripper_failure }}
      schema_diff_index: ${{ steps.ref04_independent_field_proof.outputs.schema_diff_index }}
      unsupported_ripper_type: ${{ steps.ref04_independent_field_proof.outputs.unsupported_ripper_type }}
    timeout-minutes: 25
    steps:
      - name: Checkout real XAPK via Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Unity sprite decoding tools
        run: python -m pip install UnityPy Pillow
      - name: Simulate stale previously unpacked APKs
        run: |
          mkdir -p output/apks
          printf "stale apk" > output/apks/old.apk
      - name: Extract local-only Sprite PNGs from canonical XAPK
        run: python tools/export_local_ui_art.py
      - name: Construct exact Unity Canvas import plan
        run: python tools/build_unity_prefab_manifest.py
      - name: Validate 5 scene mapping counts and Spine reference status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('output/unity-prefab-map.json').read_text(encoding='utf-8'))
          assert len(m['scenes']) == 5
          assert m['sprites'] and m['spine']
          assert all(row['bindingStatus'] in ('pointer_candidates_unverified','unresolved') for row in m['spine'])
          assert next(x['mappedSprites'] for x in m['scenes'] if x['sceneId']=='REF01-ship-upgrade') == 32
          print('PASS: Unity reconstructed source map',len(m['sprites']),'sprite assignments',len(m['spine']),'Spine nodes')
          PY
      - name: Verify local Sprite component ID resolution unit tests
        run: python -m unittest discover -s tests -p test_local_ui_art.py -v
      - name: Verify Unity prefab plan supports source component IDs
        run: python -m unittest discover -s tests -p test_unity_prefab_manifest.py -v
      - name: Verify Unity Image enabled and layout evidence tests
        run: python -m unittest discover -s tests -p test_local_ui_layout.py -v
      - name: Verify deep UI/Spine parsing without XAPK
        run: python -m unittest discover -s tests -p test_xapk_deep_evidence.py -v
      - name: Probe Sprite borders, CanvasScaler, Mask, LayoutGroup from XAPK
        run: python tools/audit_local_ui_components.py
      - name: Trace original Spine component to TextAssets (field still unverified)
        run: python tools/trace_local_spine_links.py
      - name: Export local Spine 3.8 source packs chosen by REF04 content evidence
        run: python tools/export_local_spine.py --from-evidence REF04-home-crew --limit 12
      - name: Verify REF04 candidate skeleton names match selected packs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('output/local-spine-link-evidence.json').read_text(encoding='utf-8'))
          packs=json.loads(Path('output/local-spine/manifest.json').read_text(encoding='utf-8'))
          verified={x['skeletonName'] for x in e['records'] if
                    x['sceneId']=='REF04-home-crew' and
                    x['status']=='content_chain_verified_field_unverified'}
          assert packs['packages'] and all(p['name'] in verified for p in packs['packages'])
          print('PASS: REF04 local 3.8 packs selected by original content:',len(packs['packages']))
          PY
      - name: Validate deep evidence counts and zero false binding claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          u = json.loads(Path('output/local-ui-components.json').read_text(encoding='utf-8'))
          s = json.loads(Path('output/local-spine-link-evidence.json').read_text(encoding='utf-8'))
          assert len(u['scenes']) == 5
          assert len(s['records']) == 32
          assert u['stats']['spriteGeometry'] == 963
          assert u['stats']['spriteBorders'] == 963
          assert all('imageComponentId' in g
                     for sc in u['scenes'] for g in sc['spriteGeometry'])
          assert len({(sc['sceneId'],g['imageComponentId'])
                      for sc in u['scenes'] for g in sc['spriteGeometry']})==963
          assert s['stats'].get('content_chain_verified_field_unverified') == 13
          assert all(not x['fieldVerified'] and not x['skinVerified'] and
                     not x['activeAnimationVerified'] for x in s['records'])
          print('DEEP EVIDENCE PASS:', u['stats'], s['stats'])
          PY
      - name: Test exact Unity serialized GO and prefab-pointer evidence
        run: python -m unittest discover -s tests -p test_original_unity_graph.py -v
      - name: Audit original serialized GameObject/component graph from XAPK
        run: python tools/audit_original_unity_graph.py
      - name: Test source-linked IL2CPP and UI field evidence
        run: python -m unittest discover -s tests -p test_decode_xapk_ui_provenance.py -v
      - name: Verify strict optional managed TypeTree recovery guards
        run: python -m unittest discover -s tests -p test_recover_managed_ui_fields.py -v
      - name: Audit exact MonoScript, UI managed fields and IL2CPP metadata locally
        run: python tools/decode_xapk_ui_provenance.py
      - name: Require deep UI evidence preserves source component identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('output/deep-ui-source-evidence.json').read_text(encoding='utf-8'))
          assert d['schemaVersion']==1
          assert d['status']=='VERIFIED_POINTER_AUDIT_NOT_FIELD_OFFSET_RECOVERY'
          assert len(d['scenes'])==5 and d['stats']['componentCount']==5346
          assert d['il2cpp']['files']
          assert d['globalMonoScriptResolution']['resolved']==2320
          assert d['globalMonoScriptResolution']['ambiguous']==0
          assert d['stats']['statuses']['NO_MANAGED_TYPETREE']==1201
          assert any(x['status']=='V31_HEADER_VALIDATED_NAME_HINTS_ONLY'
                     for x in d['il2cpp']['files'])
          assert all(len({x['pathId'] for x in s['components']})==len(s['components'])
                     for s in d['scenes'])
          assert all(x['status']!='SERIALIZED_FIELDS_VERIFIED' or
                     (x.get('className') and x.get('fields'))
                     for s in d['scenes'] for x in s['components'])
          print('PASS source-linked deep audit', d['stats']['statuses'])
          print('Verified managed UI fields:',d['stats']['verifiedManagedFields'])
          print('IL2CPP metadata:',[(x['version'],x['status']) for x in d['il2cpp']['files']])
          PY
      - name: Test exact per-component missing managed-field report
        run: python -m unittest discover -s tests -p test_original_unity_gaps.py -v
      - name: Generate local component-by-component recovery checklist
        run: python tools/summarize_original_unity_gaps.py
      - name: Validate full component gap CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('output/original-unity-component-gaps.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8')))
          assert len(rows)==5346,len(rows)
          assert sum(x['workStatus']=='NEEDS_MANAGED_TYPE_TREE' for x in rows)==2212
          assert len({(x['sceneId'],x['componentPathId']) for x in rows})==5346
          print('PASS source component gaps:',len(rows),'managed-unavailable:',2212)
          PY
      - name: Check original graph coverage without claiming real editor Prefabs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('output/original-unity-graph.json').read_text(encoding='utf-8'))
          assert data['version']==1
          assert len(data['scenes'])==5
          assert data['stats']['nodes']==1670
          assert all(s['provenance']['originalEditorPrefabOrScene']=='NOT_PROVEN'
                     for s in data['scenes'])
          assert all(s['stats']['nodes']==s['stats']['gameObjects'] for s in data['scenes'])
          print('PASS: original serialized graph',data['stats'])
          for scene in data['scenes']:
              print(scene['sceneId'], scene['stats']['nodes'],
                    scene['stats']['componentReferences'],
                    scene['provenance']['sourceTypeCounts'])
          PY
      - name: Extract verified RectTransform and Canvas evidence from real XAPK
        run: python tools/export_local_ui_layout.py
      - name: Verify exact original Image ownership and source visibility counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          art=json.loads(Path('output/local-ui-art/manifest.json').read_text(encoding='utf-8'))
          layout=json.loads(Path('output/local-ui-layout.json').read_text(encoding='utf-8'))
          plan=json.loads(Path('output/unity-prefab-map.json').read_text(encoding='utf-8'))
          assert art['version']==1 and layout['version']==2 and plan['schemaVersion']==2
          assert len(art['nodeBindings'])==963
          assert len(plan['sprites'])==963
          assert layout['stats']['exactImageBindings']==963
          assert layout['stats']['disabledSourceImages']==11
          assert layout['stats']['canvasWithEnabledEvidence']==4
          assert layout['stats']['canvasWithRenderModeEvidence']==4
          assert layout['stats']['disabledCanvases']==0
          bindings={(s['sceneId'],b['nodeId'],b['componentId'])
                    for s in layout['scenes'] for b in s['imageBindings']}
          assert len(bindings)==963
          assert all((p['sceneId'],p['nodeId'],p['sourceImageComponentId'])
                     in bindings for p in plan['sprites'])
          assert art['stats']['scene_nodes_mapped']['REF04-home-crew']==265
          print('PASS exact original Image mapping:',len(bindings),
                'disabled:',layout['stats']['disabledImagesByScene'])
          PY
      - name: Check all 5 serialized Unity hierarchies are matched exactly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('output/local-ui-layout.json').read_text(encoding='utf-8'))
          stats = data['stats']
          assert stats['scenes'] == 5
          assert stats['verifiedTransforms'] == 1670, stats
          for scene in data['scenes']:
              assert len({node['nodeId'] for node in scene['nodes']}) == len(scene['nodes'])
          print('PASS: exact XAPK layout evidence', stats)
          PY
      - name: Verify decoded PNGs and mapped scene paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root = Path("output/local-ui-art")
          info = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert info["version"] == 1
          print("Sprite images exported:", info["stats"]["sprite_images_exported"])
          print("UI nodes mapped:", info["stats"]["ui_nodes_mapped"])
          assert info["stats"]["sprite_images_exported"] > 0, "No Sprite could be decoded"
          assert info["stats"]["ui_nodes_mapped"] > 0, "No Image→Sprite mapping produced"
          for name in info["files"]:
              with Image.open(root / name) as image:
                  image.verify()
          print("PASS: local Sprite files verified, no artwork uploaded")
          PY


      - name: Diagnose generated IL2CPP TypeTree against exact XAPK (informational)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python -m pip install TypeTreeGeneratorAPI
          python tools/decode_xapk_ui_provenance.py --recover-managed-fields
          python - <<'PY'
          import collections
          import json
          from pathlib import Path
          data=json.loads(Path("output/deep-ui-source-evidence.json").read_text(encoding="utf-8"))
          summary=data.get("generatedBinaryProof",{}).get("verification",{})
          print("Phase 3B exact-source run:",summary)
          errors=collections.Counter(
              (row.get("binaryRecoveryPhase","unknown"),
               row.get("binaryRecoveryCode","unknown"),
               row.get("binaryRecoveryFrame","unknown"))
              for scene in data["scenes"] for row in scene["components"]
              if "binaryRecoveryCode" in row)
          for reason,count in errors.most_common(12):
              print("BLOCKED_COUNT",count,"PHASE",reason[0],
                    "CODE",reason[1],"FRAME",reason[2])
          print("No binary/art payloads are uploaded; no Prefab changes.")
          PY


      - name: Compare exact-XAPK AssetStudio and AssetRipper generator backends (informational)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python tools/probe_xapk_typetree_backends.py --backend AssetStudio
          python tools/probe_xapk_typetree_backends.py --backend AssetRipper


      - name: Verify AssetStudio-managed fields against exact XAPK (informational)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python tools/decode_xapk_ui_provenance.py --recover-managed-fields --binary-backend AssetStudio
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("output/deep-ui-source-evidence.json").read_text(encoding="utf-8"))
          print("ASSETSTUDIO STRICT VERIFIED FIELD COUNTS:",d["stats"]["verifiedManagedFields"])
          print("ASSETSTUDIO STRICT COMPONENT OUTCOMES:",
                d["generatedBinaryProof"]["verification"])
          PY

      - name: Verify AssetRipper-managed fields against exact XAPK (informational)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python tools/decode_xapk_ui_provenance.py --recover-managed-fields --binary-backend AssetRipper
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("output/deep-ui-source-evidence.json").read_text(encoding="utf-8"))
          print("ASSETRIPPER STRICT VERIFIED FIELD COUNTS:",d["stats"]["verifiedManagedFields"])
          print("ASSETRIPPER STRICT COMPONENT OUTCOMES:",
                d["generatedBinaryProof"]["verification"])
          PY


      - name: Strict cross-backend source-proven field agreement tests
        run: python -m unittest discover -s tests -p test_compare_managed_ui_backends.py -v
      - name: Verify secure two-backend field study-plan constraints
        run: python -m unittest discover -s tests -p test_verified_ui_prefab_plan.py -v
      - name: Verify non-destructive Unity study Prefab importer contract
        run: python -m unittest discover -s tests -p test_verified_ui_unity_contract.py -v
      - name: Verify exact-source visual preview binding guard tests
        run: python -m unittest discover -s tests -p test_verified_visual_plan.py -v
      - name: Verify source-preserving Unity visual importer contract
        run: python -m unittest discover -s tests -p test_verified_visual_unity_contract.py -v
      - name: Verify separate source-root Canvas viewport contract
        run: python -m unittest discover -s tests -p test_source_root_canvas_viewport_contract.py -v
      - name: Verify REF04 Image Sprite geometry provenance regression tests
        run: python -m unittest discover -s tests -p test_ref04_static_ui_geometry.py -v
      - name: Verify REF04 native Sprite border repair never guesses UI layout
        run: python -m unittest discover -s tests -p test_ref04_static_geometry_unity_contract.py -v
      - name: Verify REF04 exported PNG bounds cannot silently override XAPK native Sprite rect
        run: python -m unittest discover -s tests -p test_ref04_png_rect_mismatch.py -v
      - name: Verify original atlas Sprite offset evidence is never inferred from crop alone
        run: python -m unittest discover -s tests -p test_ref04_source_atlas_offsets.py -v
      - name: Verify reference XAPK gameplay screenshot required for REF04 pixel comparison
        run: python -m unittest discover -s tests -p test_ref04_game_screenshot_compare.py -v
      - name: Verify exact unpacked native Tight Sprite logical bounds without altering source pixels
        run: python -m unittest discover -s tests -p test_ref04_native_bounds_sprites.py -v
      - name: Verify REF04 source Tight Sprite study importer remains separate from 3C and original art
        run: python -m unittest discover -s tests -p test_ref04_native_bounds_unity_contract.py -v
      - name: Verify all 3C Image components vs exact Sprite-linked subset
        run: python -m unittest discover -s tests -p test_ref04_3c_image_inventory.py -v
      - name: Verify REF04 strict full XAPK-source UI component inventory is read-only
        run: python -m unittest discover -s tests -p test_ref04_full_source_inventory.py -v
      - name: Verify independent LayoutGroup source identity and zero guess policy
        run: python -m unittest discover -s tests -p test_ref04_layout_third_backend.py -v
      - name: Verify REF04 raw-source parser alignment and byte-offset guards
        run: python -m unittest discover -s tests -p test_ref04_layout_raw_parser.py -v
      - name: Verify dual-IL2CPP-backend raw source field agreement guards
        run: python -m unittest discover -s tests -p test_ref04_layout_dual_schema_bytes.py -v
      - name: Verify REF04 LayoutGroup TypeTree schema forensics fail closed
        run: python -m unittest discover -s tests -p test_ref04_layout_schema_forensics.py -v
      - name: Verify original IL2CPP v31 metadata method source ownership (P2)
        run: python -m unittest discover -s tests -p test_ref04_il2cpp_method_index_v31.py -v
      - name: Verify original AArch64 ELF code segment boundaries without fake method mapping (P2)
        run: python -m unittest discover -s tests -p test_ref04_arm64_elf_regions.py -v
      - name: Verify P2 native method candidates never masquerade as verified ARM64 code
        run: python -m unittest discover -s tests -p test_ref04_p2_native_method_candidates.py -v
      - name: Verify original I2 localizer term hash and source-backed schema guards (P3)
        run: python -m unittest discover -s tests -p test_ref04_p3_localizer_binary.py -v
      - name: Verify original Font source SHA pointers in same serialized file (P3)
        run: python -m unittest discover -s tests -p test_ref04_p3_original_font_objects.py -v
      - name: Verify P3 original Text fonts and source localization guards
        run: python -m unittest discover -s tests -p test_ref04_p3_text_localization.py -v
      - name: Verify Canvas/SafeArea/PanelHome2 runtime evidence cannot be guessed (P2)
        run: python -m unittest discover -s tests -p test_ref04_p2_runtime_alignment.py -v
      - name: Verify source-only Step 2 Canvas Text and LayoutGroup evidence
        run: python -m unittest discover -s tests -p test_ref04_step2_layout_canvas_text.py -v
      - name: Verify 62 Text source object bytes/font pointers guarded by XAPK provenance
        run: python -m unittest discover -s tests -p test_ref04_text_source_binary.py -v

      - name: Strict AssetStudio with exact Unity-version native header
        timeout-minutes: 10
        run: |
          python tools/decode_xapk_ui_provenance.py --recover-managed-fields --binary-backend AssetStudio --unity-native-header
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("output/deep-ui-source-evidence.json").read_text(encoding="utf-8"))
          print("ASSETSTUDIO NATIVE-HEADER FIELDS:",d["stats"]["verifiedManagedFields"])
          print("ASSETSTUDIO NATIVE-HEADER OUTCOMES:",d["generatedBinaryProof"]["verification"])
          PY
          cp output/deep-ui-source-evidence.json output/phase3b-assetstudio.json

      - name: Strict AssetRipper with exact Unity-version native header
        timeout-minutes: 10
        run: |
          python tools/decode_xapk_ui_provenance.py --recover-managed-fields --binary-backend AssetRipper --unity-native-header
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("output/deep-ui-source-evidence.json").read_text(encoding="utf-8"))
          print("ASSETRIPPER NATIVE-HEADER FIELDS:",d["stats"]["verifiedManagedFields"])
          print("ASSETRIPPER NATIVE-HEADER OUTCOMES:",d["generatedBinaryProof"]["verification"])
          PY

      - name: Require independently agreeing field values across source backends
        run: |
          python tools/compare_managed_ui_backends.py output/phase3b-assetstudio.json output/deep-ui-source-evidence.json

      - name: Build local-only double-verified managed UI Prefab plan
        run: |
          python tools/build_verified_ui_prefab_plan.py
          python - <<'PY'
          import json
          from pathlib import Path
