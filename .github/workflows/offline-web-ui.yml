name: Offline Web UI Viewer Smoke Tests
on:
  push:
    paths:
      - 'web-ui-viewer/**'
      - 'tools/serve_ui_viewer.py'
      - 'tools/export_local_ui_art.py'
      - 'tools/export_local_spine.py'
      - 'tools/probe_spine_payloads.py'
      - 'tests/test_offline_web_viewer.py'
      - 'tests/test_local_ui_art.py'
      - 'tests/test_unity_prefab_manifest.py'
      - 'tools/build_unity_prefab_manifest.py'
      - 'unity-ui-viewer/Assets/Editor/UnityCanvasReconstructor.cs'
      - 'unity-ui-viewer/Assets/Scripts/ReconstructionEvidence.cs'
      - 'tests/test_local_spine.py'
      - 'tests/test_spine_payloads.py'
      - 'tests/test_asset_matching.cjs'
      - 'CHAY_UI_OFFLINE.bat'
      - 'CHUAN_BI_DO_HOA.bat'
      - '.github/workflows/offline-web-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-web:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout without XAPK binaries
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Verify browser JavaScript syntax
        run: |
          node --check web-ui-viewer/app.js
          node --check web-ui-viewer/spine-viewer.js
          node --check web-ui-viewer/asset-matching.js
          node tests/test_asset_matching.cjs
      - name: Test local HTTP server and 5 real UI scenes
        run: python3 -m unittest discover -s tests -p test_offline_web_viewer.py -v
      - name: Test exact offline Sprite manifest mapping (no UnityPy required)
        run: python3 -m unittest discover -s tests -p test_local_ui_art.py -v
      - name: Test private Spine pack mapping (no XAPK needed)
        run: python3 -m unittest discover -s tests -p test_local_spine.py -v
      - name: Validate Unity Canvas prefab reconstruction map (no artwork)
        run: python3 -m unittest discover -s tests -p test_unity_prefab_manifest.py -v
      - name: Check local-only Unity reconstruction path and API usage
        run: |
          test -f unity-ui-viewer/Assets/Editor/UnityCanvasReconstructor.cs
          grep -q 'PrefabUtility.SaveAsPrefabAsset' unity-ui-viewer/Assets/Editor/UnityCanvasReconstructor.cs
          grep -q '/unity-ui-viewer/Assets/LocalReconstruction/' .gitignore
      - name: Verify bat entrypoint and privacy requirements
        shell: bash
        run: |
          test -f CHAY_UI_OFFLINE.bat
          grep -q 'tools\\serve_ui_viewer.py' CHAY_UI_OFFLINE.bat
          grep -q '127.0.0.1' tools/serve_ui_viewer.py
          ! grep -Eq 'https?://' web-ui-viewer/app.js
          echo "PASS: offline web viewer is local-only"
