  windows-decode:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout real XAPK with Git LFS on Windows
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Prepare Windows Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UnityPy and Pillow
        run: python -m pip install UnityPy Pillow
      - name: Test Windows-safe in-memory bundle reader
        run: python -m unittest discover -s tests -p test_local_ui_art.py -v
      - name: Extract actual game Sprite PNGs from XAPK on Windows
        run: python tools/export_local_ui_art.py
      - name: Verify deep evidence unit tests on Windows
        run: python -m unittest discover -s tests -p test_xapk_deep_evidence.py -v
      - name: Probe UI fields and original Sprite borders on Windows
        run: python tools/audit_local_ui_components.py
      - name: Trace Spine to local TextAsset content on Windows
        run: python tools/trace_local_spine_links.py
      - name: Export REF04 matched real Spine source packs on Windows
        run: python tools/export_local_spine.py --from-evidence REF04-home-crew --limit 12
      - name: Test native GameObject component pointers on Windows
        run: python -m unittest discover -s tests -p test_original_unity_graph.py -v
      - name: Check original serialized scene/prefab candidate inventory on Windows
        run: python tools/audit_original_unity_graph.py
      - name: Test source-linked IL2CPP and UI field evidence on Windows
        run: python -m unittest discover -s tests -p test_decode_xapk_ui_provenance.py -v
      - name: Verify optional source-only TypeTree recovery guards on Windows
        run: python -m unittest discover -s tests -p test_recover_managed_ui_fields.py -v
      - name: Verify double-source guarded study-plan on Windows
        run: python -m unittest discover -s tests -p test_verified_ui_prefab_plan.py -v
      - name: Verify Unity Editor importer study-copy contract on Windows
        run: python -m unittest discover -s tests -p test_verified_ui_unity_contract.py -v
      - name: Verify visual source-owner contract on Windows
        run: python -m unittest discover -s tests -p test_verified_visual_plan.py -v
      - name: Verify Unity visual copy isolation on Windows
        run: python -m unittest discover -s tests -p test_verified_visual_unity_contract.py -v
      - name: Verify original child transforms protected in viewport study on Windows
        run: python -m unittest discover -s tests -p test_source_root_canvas_viewport_contract.py -v
      - name: Verify REF04 source Image geometry guards on Windows
        run: python -m unittest discover -s tests -p test_ref04_static_ui_geometry.py -v
