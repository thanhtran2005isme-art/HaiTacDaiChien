      - name: Diagnose 24 original REF04 LayoutGroup schemas in AssetStudio and AssetRipper
        id: ref04_independent_field_proof
        timeout-minutes: 8
        run: |
          python tools/probe_ref04_layout_schema_forensics.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('output/ref04-layout-schema-forensics.json').read_text(encoding='utf-8'))
          assert d['layoutGroupsInspected']==24
          assert d['sourceFieldValuesStillBlockedFromUnity']==168
          assert (d['sourceFieldsVerifiedByTwoGeneratedSchemas']+
                  d['sourceFieldsMissingIndependentSchemaProof'])==168
          assert d['sourceFieldsVerifiedByTwoGeneratedSchemas']==168
          assert d['sourceFieldsMissingIndependentSchemaProof']==0
          assert d['independentSchemaProofStatusCounts']=={
              'TWO_SOURCE_SCHEMAS_RAW_FIELDS_AND_OFFSETS_AGREE_NOT_IMPORTED':24}
          assert sum(d['independentSchemaProofStatusCounts'].values())==24
          assert d['unityImportAllowed'] is False
          assert d['runtimeAlignmentProven'] is False
          assert d['originalUiAssetsChanged'] is False
          assert sum(d['rawByteReparseCounts'].values())==24
          assert all(x['unityImportAllowed'] is False and
                     x['runtimeLayoutProven'] is False and
                     x['rawByteReparse']['unityImportAllowed'] is False and
                     x['rawByteReparse']['derivedSchemaOnly'] is True
                     for x in d['layoutGroups'])
          print('PASS read-only source schema diagnostics:',d['schemaComparisonCounts'])
          print('READ-ONLY DERIVED-SCHEMA RAW BYTE REPLAY:',d['rawByteReparseCounts'])
          print('TWO-GENERATOR SERIALIZED FIELD PROOF:',
                d['sourceFieldsVerifiedByTwoGeneratedSchemas'],
                '/168; missing independently proven fields:',
                d['sourceFieldsMissingIndependentSchemaProof'],
                '; status:',d['independentSchemaProofStatusCounts'])
          from collections import Counter
          ripper_causes=Counter(
              x['independentSchemaRawSourceCheck'].get('backendEvidence',{})
              .get('AssetRipper',{}).get('failureCategory','NO_DETAIL')
              for x in d['layoutGroups'])
          print('RIPPER RAW BYTE FAILURE CATEGORIES:',dict(sorted(ripper_causes.items())))
          print('FIRST STRUCTURAL SCHEMA DIFFERENCE (NAMES/TYPES ONLY):',
                d['layoutGroups'][0].get('firstSchemaDifference'))
          import os
          from collections import Counter
          def main_status(dct):
              return sorted(dct, key=lambda k:(-dct[k],k))[0] if dct else 'NONE'
          reasons=Counter(
              row['independentSchemaRawSourceCheck'].get('backendEvidence',{})
                .get('AssetRipper',{}).get('failureCategory','NO_RIPPER_ERROR_OR_SCHEMA')
              for row in d['layoutGroups'])
          diff=Counter(
              str(row['firstSchemaDifference']['index'])
              for row in d['layoutGroups'] if row.get('firstSchemaDifference'))
          unsupported=Counter(
              row['independentSchemaRawSourceCheck'].get('backendEvidence',{})
                 .get('AssetRipper',{}).get('unsupportedSourceTypeName','NONE')
              for row in d['layoutGroups'])
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              for key,value in (
                  ('verified_fields', str(d['sourceFieldsVerifiedByTwoGeneratedSchemas'])),
                  ('top_blocker', main_status(d['independentSchemaProofStatusCounts'])),
                  ('top_raw_status', main_status(d['rawByteReparseCounts'])),
                  ('top_schema_status', main_status(d['schemaComparisonCounts'])),
                  ('ripper_failure', main_status(reasons)),
                  ('schema_diff_index', main_status(diff)),
                  ('unsupported_ripper_type', main_status(unsupported))
              ):
                  out.write(key+'='+value+'\n')
          PY

