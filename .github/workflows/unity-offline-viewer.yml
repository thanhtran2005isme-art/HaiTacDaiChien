name: Build Offline Unity UI Viewer Data

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_unity_viewer_data.py'
      - 'tests/test_build_unity_viewer_data.py'
      - 'tests/test_unity_spine_builtin_modules.py'
      - 'unity-ui-viewer/Assets/Scripts/**'
      - 'unity-ui-viewer/Assets/Editor/**'
      - 'unity-ui-viewer/Packages/**'
      - 'unity-ui-viewer/ProjectSettings/**'
      - '.github/workflows/unity-offline-viewer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/build_unity_viewer_data.py'
      - 'tests/test_build_unity_viewer_data.py'
      - 'tests/test_unity_spine_builtin_modules.py'
      - 'unity-ui-viewer/Assets/Scripts/**'
      - 'unity-ui-viewer/Assets/Editor/**'
      - 'unity-ui-viewer/Packages/**'
      - 'unity-ui-viewer/ProjectSettings/**'
      - 'unity-ui-viewer/Assets/StreamingAssets/ui-scenes.json'
      - '.github/workflows/unity-offline-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-ui-viewer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-offline-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tracked metadata only (no XAPK download)
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Python stdlib data integrity tests
        run: python3 -m unittest discover -s tests -p test_build_unity_viewer_data.py -v

      - name: Validate built-in Unity Physics and Animation module dependencies
        run: python3 -m unittest discover -s tests -p test_unity_spine_builtin_modules.py -v

      - name: Generate self-contained Unity StreamingAssets JSON
        run: python3 tools/build_unity_viewer_data.py --repo-root .

      - name: Check JSON schema and required references
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("unity-ui-viewer/Assets/StreamingAssets/ui-scenes.json")
          db = json.loads(p.read_text(encoding="utf-8"))
          assert db["schemaVersion"] == 1
          assert len(db["scenes"]) == 5
          assert len({s["id"] for s in db["scenes"]}) == 5
          assert sum(len(s["nodes"]) for s in db["scenes"]) > 1000
          print("PASS scenes=5 nodes=", sum(len(s["nodes"]) for s in db["scenes"]))
          print("No LFS data or game artwork were copied into the Unity project.")
          PY

      - name: Verify generated metadata is committed in the feature branch
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- unity-ui-viewer/Assets/StreamingAssets/ui-scenes.json; then
            echo "::error::ui-scenes.json differs from generated data."
            echo "Run python tools/build_unity_viewer_data.py --repo-root . on your feature branch."
            echo "Commit the generated metadata to that branch and use a pull request."
            exit 1
          fi
          echo "PASS: generated Unity metadata is reproducible; no direct push to main"
