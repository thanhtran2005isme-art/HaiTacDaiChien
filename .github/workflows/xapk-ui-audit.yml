name: XAPK UI audit
on:
  push:
    paths:
      - '*.xapk'
      - 'tools/analyze_xapk.py'
      - '.github/workflows/xapk-ui-audit.yml'
  workflow_dispatch:
    inputs:
      export_resources:
        description: 'Export candidate assets as artifact only if licensed to do so'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone including Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check real archive
        shell: bash
        run: |
          set -euo pipefail
          XAPK="$(find . -maxdepth 1 -iname '*.xapk' -print -quit)"
          test -n "$XAPK" || { echo "No XAPK"; exit 1; }
          test "$(wc -c < "$XAPK")" -gt 1000000 || { echo "Only Git LFS pointer was downloaded"; exit 1; }
          echo "XAPK=$XAPK" >> "$GITHUB_ENV"
      - name: Scan XAPK and embedded APKs
        env:
          EXPORT_RESOURCES: ${{ inputs.export_resources }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$EXPORT_RESOURCES" == "true" ]]; then
            python3 tools/analyze_xapk.py "$XAPK" --extract-assets output/resources
          else
            python3 tools/analyze_xapk.py "$XAPK"
          fi
      - name: Decode Android resource XML with apktool
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool || true
          if command -v apktool; then
            mkdir -p output/apktool
            for apk in output/apks/*.apk; do
              test -f "$apk" || continue
              apktool d -f -s "$apk" -o "output/apktool/$(basename "$apk" .apk)" || true
            done
            find output/apktool -type f | wc -l > reports/xapk/apktool_file_count.txt
          else
            echo "apktool unavailable" > reports/xapk/apktool_file_count.txt
          fi
      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xapk-ui-inventory
          path: reports/xapk/
          if-no-files-found: warn
      - name: Optional extracted resources artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_resources }}
        uses: actions/upload-artifact@v4
        with:
          name: xapk-resource-candidates
          path: output/resources/
          retention-days: 3
          if-no-files-found: warn
      - name: Commit report only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/xapk/
          if ! git diff --cached --quiet; then
            git commit -m "docs: record XAPK UI resource inventory"
            git push
          fi
