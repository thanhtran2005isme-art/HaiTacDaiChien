name: XAPK UI audit
on:
  push:
    paths:
      - '*.xapk'
      - 'tools/analyze_xapk.py'
      - 'tools/unity_index.py'
      - 'tools/ui_hierarchy.py'
      - 'tools/ui_preview.py'
      - 'tools/ui_media_audit.py'
      - 'tools/layout_spine_audit.py'
      - 'tests/test_layout_spine_audit.py'
      - 'tools/scene_visual_inventory.py'
      - 'tests/test_scene_visual_inventory.py'
      - 'tests/test_ui_preview.py'
      - 'tools/il2cpp_refs.py'
      - 'tools/sprite_links.py'
      - 'tests/test_sprite_links.py'
      - 'tests/test_il2cpp_refs.py'
      - 'tests/test_ui_hierarchy.py'
      - '.github/workflows/xapk-ui-audit.yml'
  workflow_dispatch:
    inputs:
      export_resources:
        description: 'Export candidate assets as artifact only if licensed to do so'
        type: boolean
        required: false
        default: false
concurrency:
  group: xapk-ui-audit-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone including Git LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Check real archive
        shell: bash
        run: |
          set -euo pipefail
          XAPK="$(find . -maxdepth 1 -iname '*.xapk' -print -quit)"
          test -n "$XAPK" || { echo "No XAPK"; exit 1; }
          test "$(wc -c < "$XAPK")" -gt 1000000 || { echo "Only Git LFS pointer was downloaded"; exit 1; }
          echo "XAPK=$XAPK" >> "$GITHUB_ENV"
      - name: Scan XAPK and embedded APKs
        env:
          EXPORT_RESOURCES: ${{ inputs.export_resources }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$EXPORT_RESOURCES" == "true" ]]; then
            python3 tools/analyze_xapk.py "$XAPK" --extract-assets output/resources
          else
            python3 tools/analyze_xapk.py "$XAPK"
          fi
      - name: Decode Android resource XML with apktool (manual export only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_resources }}
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool || true
          if command -v apktool; then
            mkdir -p output/apktool
            for apk in output/apks/*.apk; do
              test -f "$apk" || continue
              apktool d -f -s "$apk" -o "output/apktool/$(basename "$apk" .apk)" || true
            done
            find output/apktool -type f | wc -l > reports/xapk/apktool_file_count.txt
          else
            echo "apktool unavailable" > reports/xapk/apktool_file_count.txt
          fi
      - name: Install Unity asset parser
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Index Unity bundles and optional sprite extraction
        shell: bash
        env:
          EXPORT_RESOURCES: ${{ inputs.export_resources }}
        run: |
          python -m pip install -q UnityPy Pillow
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$EXPORT_RESOURCES" == "true" ]]; then
            python tools/unity_index.py --export-images output/resources/unity
          else
            python tools/unity_index.py
          fi
      - name: Test Unity hierarchy parsing
        run: python -m unittest discover -s tests -p test_ui_hierarchy.py -v
      - name: Map Canvas, UI root candidates and sprite metadata
        run: python tools/ui_hierarchy.py
      - name: Test IL2CPP metadata and cross-file resolver
        run: python -m unittest discover -s tests -p test_il2cpp_refs.py -v
      - name: Identify UI scripts and resolve cross-file pointers
        run: python tools/il2cpp_refs.py
      - name: Test Sprite pointer scanner
        run: python -m unittest discover -s tests -p test_sprite_links.py -v
      - name: Resolve UI Image to Sprite metadata
        run: python tools/sprite_links.py
      - name: Unit test RectTransform preview projections
        run: python -m unittest discover -s tests -p test_ui_preview.py -v
      - name: Build schematic SVG previews and classify unlinked Images
        run: python tools/ui_preview.py
      - name: Audit Sprite textures, atlas candidates and animations
        run: python tools/ui_media_audit.py
      - name: Test CanvasScaler, Spine and null Sprite pointer classification
        run: python -m unittest discover -s tests -p test_layout_spine_audit.py -v
      - name: Verify CanvasScaler reference data and Spine metadata
        run: python tools/layout_spine_audit.py
      - name: Test per-scene image and Spine dependency inventory
        run: python -m unittest discover -s tests -p test_scene_visual_inventory.py -v
      - name: Build scene visual dependency report
        run: python tools/scene_visual_inventory.py
      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xapk-ui-inventory
          path: reports/xapk/
          if-no-files-found: warn
      - name: Optional extracted resources artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_resources }}
        uses: actions/upload-artifact@v4
        with:
          name: xapk-resource-candidates
          path: output/resources/
          retention-days: 3
          if-no-files-found: warn
      - name: Commit report only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/xapk/
          if ! git diff --cached --quiet; then
            git commit -m "docs: record XAPK UI resource inventory"
            # The metadata job may start before a documentation commit lands.
            # Rebase its report-only commit rather than force-pushing main.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push raced with another update; retrying (${attempt}/3)"
            done
            echo "Could not publish fresh reports after 3 attempts"
            exit 1
          fi
